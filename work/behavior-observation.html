<script>
(function () {
  var root = document.getElementById('locked-root');
  var panel = document.getElementById('lock-panel');
  var payloadEl = document.getElementById('locked-payload');
  function load(src) {
    return new Promise(function (ok) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ok; document.body.appendChild(s); });
  }
  function initPage() {
    var p = document.querySelector('.bo-loop');
    if (!p) return;
    var bs = p.querySelectorAll('.bo-pick button');
    bs.forEach(function (b) {
      b.addEventListener('click', function () {
        var v = p.getAttribute('data-k') === b.getAttribute('data-v') ? '' : b.getAttribute('data-v');
        p.setAttribute('data-k', v);
        bs.forEach(function (x) { x.setAttribute('aria-pressed', String(v !== '' && x === b)); });
      });
    });
  }
  function start() {
    var meta = root.querySelector('dl.meta');
    if (meta && panel) panel.parentNode.insertBefore(meta, panel);
    if (panel) panel.remove();
    document.querySelector('.skip').setAttribute('href', '#define');
    initPage();
    return load('https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js')
      .then(function () { return load('https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js'); })
      .then(function () { return load('../assets/case.js?v=6'); });
  }
  if (!payloadEl) { start(); return; }

  var p = JSON.parse(payloadEl.textContent);
  var form = document.getElementById('unlock-form');
  var input = document.getElementById('unlock-pw');
  var err = document.getElementById('unlock-err');
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  input.addEventListener('input', function () { err.textContent = ''; });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    if (!input.value) { err.textContent = '비밀번호를 입력해 주세요.'; input.focus(); return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = '이 브라우저에서는 열 수 없습니다. 최신 Chrome, Safari, Edge에서 열어 주세요.'; return; }
    var btn = form.querySelector('button');
    btn.disabled = true;
    var enc = new TextEncoder();
    var iv = b64(p.iv), ct = b64(p.ct), mac = b64(p.mac);
    crypto.subtle.importKey('raw', enc.encode(input.value), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' }, base, 512); })
      .then(function (bits) {
        bits = new Uint8Array(bits);
        return Promise.all([
          crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']),
          crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify'])
        ]);
      })
      .then(function (keys) {
        var data = new Uint8Array(iv.length + ct.length);
        data.set(iv); data.set(ct, iv.length);
        return crypto.subtle.verify('HMAC', keys[1], mac, data).then(function (ok) {
          if (!ok) throw new Error('bad-password');
          return crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, keys[0], ct);
        });
      })
      .then(function (plain) {
        root.innerHTML = new TextDecoder().decode(plain);
        start();
        root.focus({ preventScroll: true });
      })
      .catch(function (x) {
        btn.disabled = false;
        err.textContent = x && x.message === 'bad-password'
          ? '비밀번호가 맞지 않습니다. 다시 확인해 주세요.'
          : '페이지를 여는 중에 문제가 생겼습니다. 새로고침 후 다시 시도해 주세요.';
        input.select();
      });
  });
})();
